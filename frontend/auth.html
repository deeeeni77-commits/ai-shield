<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود و ثبت‌نام | AI Shield</title>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Vazirmatn", sans-serif;
            background: #07111f;
            color: #e8f1fc;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border: 1px solid #1d3047;
            border-radius: 20px;
            background: #0d1b2d;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #36d9f5;
        }

        .subtitle {
            text-align: center;
            color: #8295ad;
            margin: 8px 0 25px;
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .tabs button {
            flex: 1;
            padding: 11px;
            border: 1px solid #1d3047;
            border-radius: 9px;
            background: #101f33;
            color: #a8b9ce;
            font-family: inherit;
            cursor: pointer;
        }

        .tabs button.active {
            background: #167eea;
            color: white;
            border-color: #167eea;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 17px;
            border: 1px solid #263d56;
            border-radius: 9px;
            background: #091727;
            color: white;
            font-family: inherit;
            outline: none;
        }

        input:focus {
            border-color: #36d9f5;
        }

        .submit {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(135deg, #167eea, #19b9d6);
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit:disabled {
            opacity: .6;
            cursor: wait;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        #message.show {
            display: block;
        }

        #message.error {
            background: #351824;
            color: #ff9cab;
        }

        #message.success {
            background: #10352c;
            color: #73e4bb;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #36d9f5;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="logo">AI SHIELD</div>
        <p class="subtitle">هوش مصنوعی در امنیت سایبری</p>

        <div class="tabs">
            <button type="button" id="loginTab" class="active">ورود</button>
            <button type="button" id="registerTab">ثبت‌نام</button>
        </div>

        <form id="authForm">
            <label for="username">نام کاربری</label>
            <input
                id="username"
                name="username"
                type="text"
                autocomplete="username"
                required
            >

            <div id="emailGroup" hidden>
                <label for="email">ایمیل (اختیاری)</label>
                <input
                    id="email"
                    name="email"
                    type="email"
                    autocomplete="email"
                >
            </div>

            <label for="password">رمز عبور</label>
            <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
            >

            <button class="submit" id="submitBtn" type="submit">
                ورود به حساب
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>

        <a class="back" href="index.html">بازگشت به صفحه اصلی</a>
    </main>

    <script>
        const API_BASE = "https://ai-shield-1-y5ol.onrender.com/api";

        const form = document.getElementById("authForm");
        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");
        const emailGroup = document.getElementById("emailGroup");
        const emailInput = document.getElementById("email");
        const submitBtn = document.getElementById("submitBtn");
        const message = document.getElementById("message");
        const passwordInput = document.getElementById("password");

        let mode = "login";

        function showMessage(text, type) {
            message.textContent = text;
            message.className = "show " + type;
        }

        function setMode(newMode) {
            mode = newMode;

            loginTab.classList.toggle("active", mode === "login");
            registerTab.classList.toggle("active", mode === "register");

            emailGroup.hidden = mode !== "register";

            passwordInput.autocomplete =
                mode === "register" ? "new-password" : "current-password";

            submitBtn.textContent =
                mode === "register" ? "ایجاد حساب کاربری" : "ورود به حساب";

            message.className = "";
            message.textContent = "";
        }

        loginTab.addEventListener("click", () => setMode("login"));
        registerTab.addEventListener("click", () => setMode("register"));

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (form.dataset.busy === "true") return;

            const username = document.getElementById("username").value.trim();
            const password = passwordInput.value;
            const email = emailInput.value.trim();

            if (!username || !password) {
                showMessage("نام کاربری و رمز عبور را وارد کن.", "error");
                return;
            }

            const endpoint =
                mode === "register" ? "/register/" : "/login/";

            const data = { username, password };

            if (mode === "register") {
                data.email = email;
            }

            form.dataset.busy = "true";
            submitBtn.disabled = true;
            submitBtn.textContent = "در حال بررسی...";
            message.className = "";
            message.textContent = "";

            try {
                const response = await fetch(API_BASE + endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json().catch(() => ({}));

                if (!response.ok) {
                    let errorText = result.error || result.detail ||
                        "درخواست انجام نشد. دوباره تلاش کن.";

                    if (Array.isArray(errorText)) {
                        errorText = errorText.join(" ");
                    }

                    throw new Error(errorText);
                }

                if (!result.token) {
                    throw new Error("پاسخ سرور توکن ورود نداشت.");
                }

                sessionStorage.setItem("aiShieldToken", result.token);

                showMessage(
                    mode === "register"
                        ? "ثبت‌نام موفق بود. در حال ورود..."
                        : "ورود موفق بود. در حال انتقال...",
                    "success"
                );

                window.setTimeout(() => {
                    window.location.href = "dashboard.html";
                }, 700);

            } catch (error) {
                showMessage(
                    error instanceof TypeError
                        ? "اتصال به سرور برقرار نشد. ممکن است سرور خاموش باشد یا مشکل ارتباطی وجود داشته باشد."
                        : error.message,
                    "error"
                );
            } finally {
                form.dataset.busy = "false";
                submitBtn.disabled = false;
                submitBtn.textContent =
                    mode === "register"
                        ? "ایجاد حساب کاربری"
                        : "ورود به حساب";
            }
        });
    </script>
</body>
</html>
