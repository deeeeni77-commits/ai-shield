
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود و ثبت‌نام | AI Shield</title>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            font-family: "Vazirmatn", sans-serif;
            background: radial-gradient(ellipse at top, #153652, #07111f 65%);
            color: #e8f1fc;
        }

        .card {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            border: 1px solid #203851;
            border-radius: 20px;
            background: #0d1b2d;
            box-shadow: 0 20px 70px #0005;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #36d9f5;
        }

        .subtitle {
            text-align: center;
            color: #8295ad;
            margin: 8px 0 25px;
            font-size: 13px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }

        .tabs button {
            flex: 1;
            padding: 11px;
            border: 1px solid #263b52;
            border-radius: 9px;
            background: #101f33;
            color: #a8b9ce;
            font-family: inherit;
            cursor: pointer;
        }

        .tabs button.active {
            background: #167eea;
            color: white;
            border-color: #167eea;
        }

        label {
            display: block;
            font-size: 13px;
            margin: 14px 0 7px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #263d56;
            border-radius: 9px;
            background: #091727;
            color: white;
            font-family: inherit;
            outline: none;
        }

        input:focus { border-color: #36d9f5; }

        .submit {
            width: 100%;
            margin-top: 22px;
            padding: 13px;
            border: 0;
            border-radius: 9px;
            background: linear-gradient(135deg, #167eea, #19b9d6);
            color: white;
            font-family: inherit;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit:disabled {
            opacity: .6;
            cursor: wait;
        }

        .hint {
            color: #8295ad;
            font-size: 12px;
            line-height: 1.8;
        }

        #message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.9;
            overflow-wrap: anywhere;
        }

        #message.show { display: block; }

        #message.error {
            background: #351824;
            color: #ff9cab;
        }

        #message.success {
            background: #10352c;
            color: #73e4bb;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #36d9f5;
            text-decoration: none;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">AI SHIELD</div>
        <p class="subtitle">سامانه امنیت و تشخیص تهدید</p>

        <div class="tabs">
            <button type="button" id="loginTab" class="active">ورود</button>
            <button type="button" id="registerTab">ثبت‌نام</button>
        </div>

        <form id="authForm">
            <label for="username">نام کاربری</label>
            <input id="username" name="username" type="text"
                   maxlength="150" autocomplete="username" required>

            <div id="emailGroup" hidden>
                <label for="email">ایمیل (اختیاری)</label>
                <input id="email" name="email" type="email" autocomplete="email">
            </div>

            <label for="password">رمز عبور</label>
            <input id="password" name="password" type="password"
                   autocomplete="current-password" required>

            <p id="passwordHint" class="hint" hidden>
                رمز عبور باید شرایط امنیتی تعیین‌شده توسط سرور را داشته باشد.
            </p>

            <button class="submit" id="submitBtn" type="submit">
                ورود به حساب
            </button>
        </form>

        <div id="message" role="status" aria-live="polite"></div>
        <a class="back" href="index.html">بازگشت به صفحه اصلی</a>
    </main>

    <script>
        const API_BASE = "https://ai-shield-1-y5ol.onrender.com/api";

        const form = document.getElementById("authForm");
        const loginTab = document.getElementById("loginTab");
        const registerTab = document.getElementById("registerTab");
        const emailGroup = document.getElementById("emailGroup");
        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");
        const passwordHint = document.getElementById("passwordHint");
        const submitBtn = document.getElementById("submitBtn");
        const message = document.getElementById("message");

        let mode = "login";
        let busy = false;

        function showMessage(text, type = "error") {
            message.textContent = text;
            message.className = "show " + type;
        }

        function setMode(nextMode) {
            if (busy) return;

            mode = nextMode;
            const registering = mode === "register";

            loginTab.classList.toggle("active", !registering);
            registerTab.classList.toggle("active", registering);
            emailGroup.hidden = !registering;
            passwordHint.hidden = !registering;

            passwordInput.autocomplete =
                registering ? "new-password" : "current-password";

            submitBtn.textContent =
                registering ? "ایجاد حساب کاربری" : "ورود به حساب";

            message.className = "";
            message.textContent = "";
        }

        loginTab.addEventListener("click", () => setMode("login"));
        registerTab.addEventListener("click", () => setMode("register"));

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            if (busy) return;

            const username = document.getElementById("username").value.trim();
            const password = passwordInput.value;
            const email = emailInput.value.trim();

            if (!username || !password) {
                showMessage("نام کاربری و رمز عبور را وارد کنید.");
                return;
            }

            const endpoint = mode === "register" ? "/register/" : "/login/";
            const payload = { username, password };

            if (mode === "register") {
                payload.email = email;
            }

            busy = true;
            submitBtn.disabled = true;
            submitBtn.textContent = "در حال بررسی...";
            message.className = "";
            message.textContent = "";

            try {
                const response = await fetch(API_BASE + endpoint, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Accept": "application/json"
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json().catch(() => ({}));

                if (!response.ok) {
                    let errorText =
                        data.error || data.detail || data.message;

                    if (Array.isArray(errorText)) {
                        errorText = errorText.join(" ");
                    }

                    if (errorText && typeof errorText === "object") {
                        errorText = Object.values(errorText).flat().join(" ");
                    }

                    throw new Error(
                        errorText || `درخواست ناموفق بود (خطای ${response.status}).`
                    );
                }

                if (!data.token) {
                    throw new Error("سرور توکن ورود برنگرداند؛ تنظیمات API را بررسی کنید.");
                }

                sessionStorage.setItem("aiShieldToken", data.token);

                if (data.username) {
                    sessionStorage.setItem("aiShieldUsername", data.username);
                }

                if (data.is_staff) {
                    showMessage("ورود موفق بود؛ در حال انتقال به داشبورد...", "success");
                    window.location.href = "dashboard.html";
                    return;
                }

                if (mode === "register") {
                    showMessage(
                        "ثبت‌نام موفق بود؛ اما دسترسی داشبورد باید جداگانه تنظیم شود.",
                        "success"
                    );
                } else {
                    showMessage(
                        "ورود موفق بود؛ حساب شما وارد شد، اما دسترسی داشبورد مدیران را ندارید.",
                        "success"
                    );
                }

            } catch (error) {
                showMessage(
                    error instanceof TypeError
                        ? "ارتباط با سرور برقرار نشد. وضعیت Render و تنظیمات CORS را بررسی کنید."
                        : error.message
                );
            } finally {
                busy = false;
                submitBtn.disabled = false;
                submitBtn.textContent =
                    mode === "register" ? "ایجاد حساب کاربری" : "ورود به حساب";
            }
        });
    </script>
</body>
</html>
